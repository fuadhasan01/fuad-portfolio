<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cqrsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <pattern id="cqrsGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#cqrsBg)" rx="16" />
  <rect width="800" height="450" fill="url(#cqrsGrid)" rx="16" />

  <g transform="translate(60, 40)">
    <rect width="180" height="28" rx="14" fill="#8B5CF6" fill-opacity="0.2" stroke="#A78BFA" stroke-width="1" />
    <text x="90" y="18" fill="#C4B5FD" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CLEAN ARCHITECTURE</text>
  </g>

  <!-- Client & Split Arrows -->
  <g transform="translate(60, 95)">
    <!-- Client API Request -->
    <rect x="0" y="90" width="140" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="70" y="130" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">API Request</text>
    <text x="70" y="150" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Controller / Endpoint</text>

    <!-- Top Branch: Command Flow -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="220" height="110" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" />
      <text x="16" y="28" fill="#F87171" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">COMMANDS (Write Model)</text>
      <text x="16" y="52" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500">CreateOrderCommand</text>
      <text x="16" y="74" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Domain validation &amp; invariants</text>
      <text x="16" y="94" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">State mutations committed</text>

      <!-- Target DB -->
      <rect x="270" y="20" width="180" height="70" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="360" y="50" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Normalized Database</text>
      <text x="360" y="70" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Relational Write Store</text>
    </g>

    <!-- Bottom Branch: Query Flow -->
    <g transform="translate(190, 150)">
      <rect x="0" y="0" width="220" height="110" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
      <text x="16" y="28" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">QUERIES (Read Model)</text>
      <text x="16" y="52" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500">GetOrderSummaryQuery</text>
      <text x="16" y="74" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Fast, no-tracking projections</text>
      <text x="16" y="94" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Optimized for UI response DTOs</text>

      <!-- Read Target -->
      <rect x="270" y="20" width="180" height="70" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="360" y="50" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Read Model / Views</text>
      <text x="360" y="70" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Indexed Projections / Cache</text>
    </g>
  </g>
</svg>

