<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="accBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <pattern id="accGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#accBg)" rx="16" />
  <rect width="800" height="480" fill="url(#accGrid)" rx="16" />

  <g transform="translate(60, 50)">
    <rect width="680" height="380" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect width="680" height="40" rx="12" fill="#0F172A" />
    <circle cx="24" cy="20" r="5" fill="#EF4444" />
    <circle cx="42" cy="20" r="5" fill="#F59E0B" />
    <circle cx="60" cy="20" r="5" fill="#10B981" />
    <text x="340" y="24" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="500">Mini Account — Double-Entry General Ledger</text>

    <!-- Sidebar -->
    <rect x="0" y="40" width="160" height="340" fill="#0F172A" fill-opacity="0.6" />
    <rect x="16" y="60" width="128" height="24" rx="6" fill="#2563EB" fill-opacity="0.2" />
    <text x="32" y="76" fill="#60A5FA" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Chart of Accounts</text>
    <rect x="16" y="94" width="128" height="24" rx="6" fill="transparent" />
    <text x="32" y="110" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">Voucher Entry</text>
    <rect x="16" y="128" width="128" height="24" rx="6" fill="transparent" />
    <text x="32" y="144" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">Journal Ledger</text>
    <rect x="16" y="162" width="128" height="24" rx="6" fill="transparent" />
    <text x="32" y="178" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">Trial Balance</text>

    <!-- Main Content Area -->
    <g transform="translate(180, 56)">
      <!-- Metric Cards -->
      <rect x="0" y="0" width="150" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Debit Total</text>
      <text x="14" y="50" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Balanced</text>

      <rect x="165" y="0" width="150" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="179" y="24" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Credit Total</text>
      <text x="179" y="50" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">Balanced</text>

      <rect x="330" y="0" width="150" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="344" y="24" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Transactions</text>
      <text x="344" y="50" fill="#60A5FA" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">ACID Safe</text>

      <!-- Ledger Voucher Preview -->
      <rect x="0" y="80" width="480" height="150" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="16" y="106" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Journal Voucher — Balanced Double-Entry</text>
      
      <!-- Table Rows -->
      <rect x="16" y="120" width="448" height="28" rx="4" fill="#1E293B" />
      <text x="28" y="138" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="11">1010 - Cash at Bank (Dr)</text>
      <text x="412" y="138" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ 50,000.00</text>

      <rect x="16" y="154" width="448" height="28" rx="4" fill="#1E293B" fill-opacity="0.6" />
      <text x="28" y="172" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="11">2010 - Accounts Payable (Cr)</text>
      <text x="412" y="172" fill="#F87171" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">- 50,000.00</text>

      <rect x="16" y="188" width="448" height="28" rx="4" fill="#1E293B" fill-opacity="0.4" />
      <text x="28" y="206" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Net Status: Double-Entry Balanced</text>
      <rect x="370" y="192" width="84" height="20" rx="10" fill="#10B981" fill-opacity="0.2" />
      <text x="412" y="206" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Balanced</text>

      <!-- Tech Stack Badges at Bottom -->
      <g transform="translate(0, 244)">
        <rect x="0" y="0" width="80" height="24" rx="12" fill="#334155" />
        <text x="40" y="16" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">.NET 8</text>

        <rect x="88" y="0" width="104" height="24" rx="12" fill="#334155" />
        <text x="140" y="16" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Razor Pages</text>

        <rect x="200" y="0" width="94" height="24" rx="12" fill="#334155" />
        <text x="247" y="16" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">SQL Server</text>

        <rect x="302" y="0" width="60" height="24" rx="12" fill="#334155" />
        <text x="332" y="16" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">C#</text>
      </g>
    </g>
  </g>
</svg>

