<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E14" />
      <stop offset="100%" stop-color="#07070A" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8F73E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C8F73E" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(240, 237, 232, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="750" fill="url(#bgGrad)" />
  <rect width="600" height="750" fill="url(#grid)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="300" cy="280" r="180" fill="url(#accentGlow)" />

  <!-- Outer Framing Lines -->
  <rect x="24" y="24" width="552" height="702" fill="none" stroke="rgba(240, 237, 232, 0.08)" stroke-width="1" />
  
  <!-- Corner Crosshairs -->
  <path d="M 18 24 L 30 24 M 24 18 L 24 30" stroke="#C8F73E" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 570 24 L 582 24 M 576 18 L 576 30" stroke="#C8F73E" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 18 726 L 30 726 M 24 720 L 24 732" stroke="#C8F73E" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 570 726 L 582 726 M 576 720 L 576 732" stroke="#C8F73E" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Minimalist Portrait Silhouette -->
  <g transform="translate(300, 280)">
    <!-- Aura Ring -->
    <circle cx="0" cy="0" r="105" fill="#111118" stroke="rgba(240, 237, 232, 0.12)" stroke-width="1.5" />
    
    <!-- Stylized Head Silhouette -->
    <circle cx="0" cy="-22" r="38" fill="none" stroke="#F0EDE8" stroke-width="2" stroke-opacity="0.85" />
    
    <!-- Stylized Shoulders Silhouette -->
    <path d="M -68 62 C -62 18, -32 6, 0 6 C 32 6, 62 18, 68 62" fill="none" stroke="#F0EDE8" stroke-width="2" stroke-opacity="0.85" stroke-linecap="round" />

    <!-- Center Monogram Accent -->
    <text x="0" y="-14" font-family="'Instrument Serif', Georgia, serif" font-size="28" fill="#C8F73E" text-anchor="middle" font-style="italic">FH</text>
  </g>

  <!-- Typography & Placeholder Guidance -->
  <g transform="translate(300, 480)" text-anchor="middle">
    <!-- Eyebrow -->
    <text y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C8F73E" letter-spacing="3" text-transform="uppercase">
      — PORTRAIT PLACEHOLDER
    </text>

    <!-- Name Heading -->
    <text y="36" font-family="'Instrument Serif', Georgia, serif" font-size="34" fill="#F0EDE8" font-weight="normal">
      Fuad Hasan
    </text>

    <!-- Subhead -->
    <text y="64" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8A8A9A" letter-spacing="1">
      Full Stack Software Engineer
    </text>

    <!-- Instruction Box -->
    <g transform="translate(0, 105)">
      <rect x="-160" y="-18" width="320" height="36" rx="6" fill="#14141E" stroke="rgba(240, 237, 232, 0.1)" stroke-width="1" />
      <text y="5" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A8A9A">
        Place photo at <tspan fill="#F0EDE8">public/images/profile.jpg</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Coordinate Metadata -->
  <g transform="translate(48, 706)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5E5E6E">
    <text x="0" y="0">23.8103° N, 90.4125° E</text>
    <text x="504" y="0" text-anchor="end">ASPECT 4:5 • RAW</text>
  </g>
</svg>

