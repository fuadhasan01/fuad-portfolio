<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <pattern id="dbGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#dbBg)" rx="16" />
  <rect width="800" height="450" fill="url(#dbGrid)" rx="16" />

  <g transform="translate(60, 40)">
    <rect width="180" height="28" rx="14" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" />
    <text x="90" y="18" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DATABASE PERFORMANCE</text>
  </g>

  <!-- Query Optimization Comparison Cards -->
  <g transform="translate(60, 95)">
    <!-- Bad Practice Card: N+1 -->
    <rect x="0" y="0" width="320" height="270" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="40" rx="12" fill="#EF4444" fill-opacity="0.2" />
    <text x="20" y="26" fill="#F87171" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Anti-Pattern: N+1 &amp; Full Entity Loading</text>
    
    <text x="20" y="70" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12 font-weight="500">var orders = await ctx.Orders.ToListAsync();</text>
    <text x="20" y="95" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">foreach(var o in orders) {</text>
    <text x="35" y="115" fill="#F87171" font-family="Inter, system-ui, sans-serif" font-size="12">  // Triggers separate DB roundtrip!</text>
    <text x="35" y="135" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">  var items = await ctx.Items...</text>
    <text x="20" y="155" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">}</text>

    <line x1="20" y1="180" x2="300" y2="180" stroke="#334155" stroke-width="1" />
    <text x="20" y="210" fill="#F87171" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Impact: 100+ DB Roundtrips</text>
    <text x="20" y="235" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">High latency, memory bloat from tracking</text>

    <!-- Optimized Card: AsNoTracking + Select Projection -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="320" height="270" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <rect x="0" y="0" width="320" height="40" rx="12" fill="#10B981" fill-opacity="0.2" />
      <text x="20" y="26" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Optimized: Projection &amp; AsNoTracking</text>

      <text x="20" y="70" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">var dtos = await ctx.Orders</text>
      <text x="35" y="90" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="12">  .AsNoTracking()</text>
      <text x="35" y="110" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="12">  .Select(o => new OrderDto {</text>
      <text x="50" y="130" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">    Id = o.Id, Total = o.Total</text>
      <text x="35" y="150" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">  }).ToListAsync();</text>

      <line x1="20" y1="180" x2="300" y2="180" stroke="#334155" stroke-width="1" />
      <text x="20" y="210" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Result: 1 SQL Query (Selective Columns)</text>
      <text x="20" y="235" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11">Minimal payload, 0 change-tracker overhead</text>
    </g>
  </g>
</svg>

